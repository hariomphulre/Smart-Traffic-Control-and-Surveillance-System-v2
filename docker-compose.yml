services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3001"
      FRONTEND_URL: http://localhost:3000
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
    volumes:
      - ./ml_service/traffic_signal_simulation:/ml_service/traffic_signal_simulation
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL the browser uses to call the API (host machine, not Docker service name)
        NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
