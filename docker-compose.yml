version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic} -d ${POSTGRES_DB:-traffic_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-traffic}
      PGPASSWORD: ${POSTGRES_PASSWORD:-traffic}
      PGDATABASE: ${POSTGRES_DB:-traffic_db}
    volumes:
      - ./postgres/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Applying SQL migrations..."
        for f in /migrations/*.sql; do
          [ -f "$$f" ] || continue
          echo "Running $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "Migrations complete."
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ml-service:
    image: ghcr.io/hariomphulre/signal-x-ml-service:latest
    environment:
      REDIS_URL: redis://redis:6379/0
      ML_DEFAULT_MODEL: ${ML_DEFAULT_MODEL:-new_car4_with_helmet.pt}
      ML_DEFAULT_RESOLUTION: ${ML_DEFAULT_RESOLUTION:-500x300}
      ML_MAX_PARTITIONS: ${ML_MAX_PARTITIONS:-4}
      ML_PARTITION_STAGGER_SEC: ${ML_PARTITION_STAGGER_SEC:-5}
      DISABLE_ML_STATS_LOOP: "true"
    volumes:
      - ./local_data:/local_data
      # Notice: I removed the local source code mount (./ml_service:/app) 
      # because the code is now securely baked directly into the Docker image!
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

  worker-service:
    image: ghcr.io/hariomphulre/signal-x-worker-service:latest
    environment:
      REDIS_URL: redis://redis:6379/0
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
      TRAFFIC_POLL_MS: "500"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  websocket-service:
    image: ghcr.io/hariomphulre/signal-x-websocket-service:latest
    environment:
      REDIS_URL: redis://redis:6379/0
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
      PORT: "8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ghcr.io/hariomphulre/signal-x-backend:latest
    environment:
      PORT: "3001"
      NODE_ENV: production
      DOCKER: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-traffic}:${POSTGRES_PASSWORD:-traffic}@postgres:5432/${POSTGRES_DB:-traffic_db}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
      USE_MOCK_DATA: "false"
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
      WEBAUTHN_RPID: ${PUBLIC_DOMAIN:-signal-x.hariomphulre.tech}
      WEBAUTHN_RPNAME: Signal-X
      WEBAUTHN_ORIGIN: https://${PUBLIC_DOMAIN:-signal-x.hariomphulre.tech}
    volumes:
      - ./local_data:/local_data:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  emergency-backend:
    image: ghcr.io/hariomphulre/signal-x-emergency-backend:latest
    environment:
      NODE_ENV: production
      PORT: "4000"
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
    restart: unless-stopped

  frontend:
    image: ghcr.io/hariomphulre/signal-x-frontend:latest
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3001
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - ./frontend/data:/app/data
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

  nginx:
    image: ghcr.io/hariomphulre/signal-x-nginx:latest
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-signal-x.hariomphulre.tech}
    depends_on:
      - frontend
      - backend
      - ml-service
      - websocket-service
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    profiles: ["streaming"]
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "9997:9997"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: