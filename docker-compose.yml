# Smart Traffic Control & Surveillance — full stack
# Usage: cp .env.example .env && docker compose up --build
# App entry: http://localhost  (nginx)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic} -d ${POSTGRES_DB:-traffic_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    # ml-service is internal; access via nginx proxy. Do not publish to host by default.
    environment:
      REDIS_URL: redis://redis:6379/0
      ML_DEFAULT_MODEL: ${ML_DEFAULT_MODEL:-new_car4_with_helmet.pt}
      ML_DEFAULT_RESOLUTION: ${ML_DEFAULT_RESOLUTION:-500x300}
      ML_MAX_PARTITIONS: ${ML_MAX_PARTITIONS:-1}
      ML_PARTITION_STAGGER_SEC: ${ML_PARTITION_STAGGER_SEC:-6}
      DISABLE_ML_STATS_LOOP: "true"
    volumes:
      - ./ml_service:/app
      - ./local_data:/local_data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

  worker-service:
    build:
      context: ./worker-service
    environment:
      REDIS_URL: redis://redis:6379/0
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
      TRAFFIC_POLL_MS: "500"
    volumes:
      - ./ml_service/traffic_signal_simulation:/ml_service/traffic_signal_simulation:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  websocket-service:
    build:
      context: ./websocket-service
    environment:
      REDIS_URL: redis://redis:6379/0
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
      PORT: "8080"
    volumes:
      - ./ml_service/traffic_signal_simulation:/ml_service/traffic_signal_simulation:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # backend is internal; proxied by nginx. Do not publish host port to avoid conflicts.
    # Do NOT mount backend/.env — it may point at Neon and break Docker Postgres
    environment:
      PORT: "3001"
      NODE_ENV: production
      DOCKER: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-traffic}:${POSTGRES_PASSWORD:-traffic}@postgres:5432/${POSTGRES_DB:-traffic_db}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${PUBLIC_ORIGIN:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost},http://localhost:3000
      USE_MOCK_DATA: "false"
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
    volumes:
      - ./ml_service/traffic_signal_simulation:/ml_service/traffic_signal_simulation
      - ./local_data:/local_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  emergency-backend:
    build:
      context: ./emergency-backend
      dockerfile: Dockerfile
    # emergency-backend is internal; proxied by nginx at /emergency/. Do not publish host port.
    environment:
      NODE_ENV: production
      PORT: "4000"
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost},http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_ORIGIN:-http://localhost}
        NEXT_PUBLIC_ML_SERVICE_URL: ${PUBLIC_ORIGIN:-http://localhost}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_ORIGIN:-ws://localhost}/ws/analytics
        NEXT_PUBLIC_EMERGENCY_SOCKET_URL: ${PUBLIC_EMERGENCY_SOCKET_URL:-http://localhost:4000}
        BACKEND_INTERNAL_URL: http://backend:3001
        ML_SERVICE_URL: http://ml-service:8000
    # frontend is proxied by nginx; do not publish host port to avoid conflicts.
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3001
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-signalx.hariomphulre.tech}
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - ml-service
      - websocket-service
    restart: unless-stopped

  # Optional RTSP gateway (profile: streaming)
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    profiles: ["streaming"]
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "9997:9997"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
