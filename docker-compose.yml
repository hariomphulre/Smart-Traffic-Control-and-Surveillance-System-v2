# Smart Traffic Control & Surveillance — full stack
# Usage: cp .env.example .env && docker compose up -d --build
# App entry: https://signal-x.hariomphulre.tech

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    # Ports commented out to prevent collisions with future projects on this VPS
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic} -d ${POSTGRES_DB:-traffic_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    # Ports commented out to prevent collisions
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      ML_DEFAULT_MODEL: ${ML_DEFAULT_MODEL:-new_car4_with_helmet.pt}
      ML_DEFAULT_RESOLUTION: ${ML_DEFAULT_RESOLUTION:-500x300}
      ML_MAX_PARTITIONS: ${ML_MAX_PARTITIONS:-1}
      ML_PARTITION_STAGGER_SEC: ${ML_PARTITION_STAGGER_SEC:-6}
      DISABLE_ML_STATS_LOOP: "true"
    volumes:
      - ./ml_service:/app
      - ./local_data:/local_data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

  worker-service:
    build:
      context: ./worker-service
    environment:
      REDIS_URL: redis://redis:6379/0
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
      TRAFFIC_POLL_MS: "500"
    volumes:
      - ./ml_service/traffic_signal_simulation:/ml_service/traffic_signal_simulation:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  websocket-service:
    build:
      context: ./websocket-service
    environment:
      REDIS_URL: redis://redis:6379/0
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
      PORT: "8080"
    volumes:
      - ./ml_service/traffic_signal_simulation:/ml_service/traffic_signal_simulation:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      NODE_ENV: production
      DOCKER: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-traffic}:${POSTGRES_PASSWORD:-traffic}@postgres:5432/${POSTGRES_DB:-traffic_db}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
      USE_MOCK_DATA: "false"
      TRAFFIC_JSON_PATH: /ml_service/traffic_signal_simulation/traffic.json
    volumes:
      - ./ml_service/traffic_signal_simulation:/ml_service/traffic_signal_simulation
      - ./local_data:/local_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  emergency-backend:
    build:
      context: ./emergency-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These URLs must point to your public domain so the user's browser can route them correctly
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
        NEXT_PUBLIC_ML_SERVICE_URL: ${PUBLIC_ORIGIN:-https://signal-x.hariomphulre.tech}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_ORIGIN:-wss://signal-x.hariomphulre.tech}/ws/analytics
        NEXT_PUBLIC_EMERGENCY_SOCKET_URL: ${PUBLIC_EMERGENCY_SOCKET_URL:-https://signal-x.hariomphulre.tech/emergency}
        BACKEND_INTERNAL_URL: http://backend:3001
        ML_SERVICE_URL: http://ml-service:8000
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3001
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      # THIS IS THE MAGIC PORT MAPPING THAT CONNECTS TO YOUR VPS NGINX
      - "127.0.0.1:8080:80"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-signal-x.hariomphulre.tech}
    depends_on:
      - frontend
      - backend
      - ml-service
      - websocket-service
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    profiles: ["streaming"]
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "9997:9997"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: