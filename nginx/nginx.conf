worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream backend_upstream {
    server backend:3001;
  }

  upstream ml_upstream {
    server ml-service:8000;
  }

  upstream websocket_upstream {
    server websocket-service:8080;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    # ── Frontend Next API (simulation proxy, videos) — before /api/ ─
    location ^~ /api/simulation/ {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location ^~ /api/videos {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # ── Backend REST API ─────────────────────────────────────────────
    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket analytics (simulation traffic.json) ────────────────
    location /ws/ {
      proxy_pass http://websocket_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # ── ML service (optional direct API) ─────────────────────────────
    location /ml/ {
      rewrite ^/ml/(.*)$ /$1 break;
      proxy_pass http://ml_upstream;
      proxy_set_header Host $host;
    }

    # ── HLS streams & video files ────────────────────────────────────
    location /streams/ {
      proxy_pass http://ml_upstream;
      proxy_buffering off;
      proxy_set_header Host $host;
      add_header Cache-Control "no-store";
    }

    location /video-files/ {
      proxy_pass http://ml_upstream;
      proxy_set_header Host $host;
    }

    # ── Frontend SPA ───────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
