name: GHCR

on:
  push:
    branches:
      - deploy

# Set global environment variables
env:
  REGISTRY: ghcr.io
  # GitHub automatically converts the repo owner to lowercase, which Docker requires
  GITHUB_USERNAME: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Allows GitHub Actions to push images to your GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. Build Nginx ---
      - name: Build and push Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/signal-x-nginx:latest

      # --- 2. Build Python ML Service ---
      - name: Build and push ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/signal-x-ml-service:latest

      # --- 3. Build Worker Service ---
      - name: Build and push Worker Service
        uses: docker/build-push-action@v5
        with:
          context: ./worker-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/signal-x-worker-service:latest

      # --- 4. Build WebSocket Service ---
      - name: Build and push WebSocket Service
        uses: docker/build-push-action@v5
        with:
          context: ./websocket-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/signal-x-websocket-service:latest

      # --- 5. Build Main Node.js Backend ---
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/signal-x-backend:latest

      # --- 6. Build Emergency Node.js Backend ---
      - name: Build and push Emergency Backend
        uses: docker/build-push-action@v5
        with:
          context: ./emergency-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/signal-x-emergency-backend:latest

      # --- 7. Build Next.js Frontend (WITH BUILD ARGS) ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USERNAME }}/signal-x-frontend:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://signal-x.hariomphulre.tech
            NEXT_PUBLIC_ML_SERVICE_URL=https://signal-x.hariomphulre.tech
            NEXT_PUBLIC_WS_URL=wss://signal-x.hariomphulre.tech/ws/analytics
            NEXT_PUBLIC_EMERGENCY_SOCKET_URL=https://signal-x.hariomphulre.tech/emergency
            NEXT_PUBLIC_EMERGENCY_SOCKET_PATH=/emergency/socket.io
            NEXT_PUBLIC_EMERGENCY_SOCKET_TRANSPORTS=polling,websocket

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Securely copy the Compose file AND necessary config folders to the VPS
      - name: Copy config files to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          # source: "docker-compose.yml,postgres/,mediamtx/,frontend/data/"
          source: "docker-compose.yml,postgres/,mediamtx/"
          target: "CodingWorkspace/Projects/signal-x/"

      - name: Pull Images and Restart Containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            set -e
            cd CodingWorkspace/Projects/signal-x
            
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            
            docker compose pull
            
            # docker compose up -d --remove-orphans
            
            # docker system prune -a -f
            
            # echo "Waiting 10 seconds for containers to initialize..."
            # sleep 10
            
            # if [ $(docker ps -q | wc -l) -gt 0 ]; then
            #   echo "✅ Deployment Successful! Current live containers:"
            #   docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            # else
            #   echo "❌ Health Check Failed! No containers are running."
            #   exit 1
            # fi

            if docker compose up -d --remove-orphans --wait --wait-timeout 260; then
    
                docker image prune -f 
                
                echo "✅ Deployment Successful! Current live containers:"
                docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                
            else
                echo "❌ Deployment Failed or Timed Out! Check container logs."
                exit 1
            fi